<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briefing residencial — Lavanderia</title>
    <!-- replace to link -->
</head>

<body>
    <header>
        Marcella Sol
    </header>

    <main>
        <p>Briefing residencial</p>

        <div class="progress"></div>

        <div class="form-page-container">
            <div class="form-page-14">

                <h1 class="briefing-title">Lavanderia</h1>

                <p class="briefing-subtitle">
                    Conte-nos como deve ser a lavanderia ideal para vocês.
                </p>

                <div class="briefing-input-box">
                    <p>1. Qual equipamento será utilizado para lavagem?</p>

                    <div class="briefing-options">
                        <label>
                            <input type="radio" name="form-input-97" value="maquina-convencional">
                            <span>Máquina convencional</span>
                        </label>

                        <label>
                            <input type="radio" name="form-input-97" value="lava-e-seca">
                            <span>Lava e seca</span>
                        </label>

                        <label>
                            <input type="radio" name="form-input-97" value="ainda-nao-sabemos">
                            <span>Ainda não sabemos</span>
                        </label>

                        <label>
                            <input type="radio" name="form-input-97" value="ja-possuimos">
                            <span>Já possuímos</span>
                        </label>
                    </div>
                </div>

                <div class="briefing-input-box">
                    <p>3. Quais são as necessidades de armazenamento?</p>

                    <div class="briefing-options">
                        <label>
                            <input type="checkbox" name="form-input-100" value="produtos-de-limpeza">
                            <span>Produtos de limpeza</span>
                        </label>

                        <label>
                            <input type="checkbox" name="form-input-100" value="vassouras-utensilios">
                            <span>Vassouras e utensílios</span>
                        </label>

                        <label>
                            <input type="checkbox" name="form-input-100" value="cestos-para-roupas">
                            <span>Cestos para roupas</span>
                        </label>

                        <label>
                            <input type="checkbox" name="form-input-100" value="aspirador-de-po">
                            <span>Aspirador de pó</span>
                        </label>

                        <label>
                            <input type="checkbox" name="form-input-100" value="tabua-ferro-de-passar">
                            <span>Tábua e ferro de passar</span>
                        </label>

                        <label>
                            <input type="checkbox" name="form-input-100" value="outros">
                            <span>Outros</span>
                        </label>
                    </div>

                    <input
                        type="text"
                        class="briefing-input"
                        name="form-input-101"
                        placeholder="Qual?"
                    >
                </div>

                <div class="briefing-input-box">
                    <p>4. Há algum hábito ou necessidade especial que devemos considerar?</p>

                    <textarea
                        class="briefing-input-big"
                        maxlength="300"
                        placeholder="Ex.: lavagem frequente de roupas delicadas, separação de brancas e coloridas, espaço para pet, entre outros."
                    ></textarea>
                    <small>0/300</small>
                </div>

                <div class="briefing-navigation">
                    <a>← Voltar</a>
                    <a>Continuar →</a>
                </div>

            </div>
        </div>
    </main>
</body>

</html>
