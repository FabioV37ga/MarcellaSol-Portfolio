<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briefing residencial — Ambientes</title>
    <link rel="stylesheet" href="client/styles/briefing/briefing.css">
</head>

<body>
    <header>
        Marcella Sol
    </header>

    <main>
        <p>Briefing residencial</p>

        <div class="progress"></div>

        <div class="form-page-container">
            <div class="form-page-09">

                <h1 class="briefing-title">Ambientes — visão geral</h1>

                <p class="briefing-subtitle">
                    Confira os ambientes selecionados para este projeto.
                </p>

                <div class="briefing-project-summary">
                    <img class="briefing-project-icon" src="/images/briefing/rooms/imovel.png" alt="Ícone do imóvel">
                    <span>55 m²</span>
                    <span>·</span>
                    <span>casal</span>
                </div>

                <div class="briefing-environments">
                    <button type="button" class="briefing-environment-option" value="sala-de-estar">
                        <img class="briefing-environment-icon" src="/images/briefing/rooms/sala-de-estar.png" alt="Ícone da sala de estar">
                        <span>Sala de estar</span>
                        <span aria-hidden="true">›</span>
                    </button>

                    <button type="button" class="briefing-environment-option" value="sala-de-jantar">
                        <img class="briefing-environment-icon" src="/images/briefing/rooms/sala-de-jantar.png" alt="Ícone da sala de jantar">
                        <span>Sala de jantar</span>
                        <span aria-hidden="true">›</span>
                    </button>

                    <button type="button" class="briefing-environment-option" value="cozinha">
                        <img class="briefing-environment-icon" src="/images/briefing/rooms/cozinha.png" alt="Ícone da cozinha">
                        <span>Cozinha</span>
                        <span aria-hidden="true">›</span>
                    </button>

                    <button type="button" class="briefing-environment-option" value="varanda">
                        <img class="briefing-environment-icon" src="/images/briefing/rooms/varanda.png" alt="Ícone da varanda">
                        <span>Varanda</span>
                        <span aria-hidden="true">›</span>
                    </button>

                    <button type="button" class="briefing-environment-option" value="lavanderia">
                        <img class="briefing-environment-icon" src="/images/briefing/rooms/area-de-servico.png" alt="Ícone da área de serviço">
                        <span>Área de Serviço</span>
                        <span aria-hidden="true">›</span>
                    </button>

                    <button type="button" class="briefing-environment-option" value="suite">
                        <img class="briefing-environment-icon" src="/images/briefing/rooms/suite.png" alt="Ícone da suíte">
                        <span>Suíte</span>
                        <span aria-hidden="true">›</span>
                    </button>

                    <button type="button" class="briefing-environment-option" value="segundo-quarto">
                        <img class="briefing-environment-icon" src="/images/briefing/rooms/segundo-quarto.png" alt="Ícone do segundo quarto">
                        <span>Segundo quarto</span>
                        <span aria-hidden="true">›</span>
                    </button>

                    <button type="button" class="briefing-environment-option" value="banheiro-lavabo">
                        <img class="briefing-environment-icon" src="/images/briefing/rooms/banheiro-lavabo.png" alt="Ícone do banheiro e lavabo">
                        <span>Banheiro / Lavabo</span>
                        <span aria-hidden="true">›</span>
                    </button>
                </div>

                <div class="briefing-navigation">
                    <a>← Voltar</a>
                    <a>Continuar →</a>
                </div>

            </div>
        </div>
    </main>
</body>

</html>
